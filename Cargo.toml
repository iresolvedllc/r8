[workspace]
resolver = "2"
members = [
  "crates/r8-abi",
  "crates/r8-api",
  "crates/r8-cli",
  "crates/r8-core",
  "crates/r8-front",
  "crates/r8-ir",
  "crates/r8-runtime",
  "crates/r8-test262",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
