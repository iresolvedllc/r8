name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rust tests
        run: cargo test --workspace

      - name: zig tests
        run: zig test src/root.zig
        working-directory: zig

      - name: selftest
        run: cargo run -p r8-cli -- selftest

      - name: smoke fixture (arith.js)
        run: cargo run -p r8-cli -- run tests/smoke/arith.js
